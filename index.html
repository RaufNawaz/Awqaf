<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awqaf Mosque Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="site-shell">
      <div id="map" aria-label="Map of Awqaf locations"></div>

      <aside id="filtersPanel" class="map-panel filters-panel" aria-label="Search and filters">
        <button
          id="filtersPanelToggle"
          class="panel-toggle"
          type="button"
          aria-label="Toggle left panel"
        >
          <span class="panel-toggle-icon" aria-hidden="true"></span>
        </button>

        <div class="panel-scroll">
          <div class="panel-hero">
            <p class="panel-kicker">Awqaf Atlas</p>

            <div class="panel-hero-row">
              <div class="panel-title-block">
                <h1 id="siteTitle">Awqaf Mosque Map</h1>
                <p id="siteSubtitle" class="panel-subtitle hidden"></p>
              </div>

              <button id="fitResultsButton" class="primary-button" type="button">
                Fit Results
              </button>
            </div>
          </div>

          <section class="panel-card controls-card" aria-label="Filters">
            <div class="field">
              <span>Search</span>
              <input
                id="searchInput"
                type="search"
                placeholder="Search by shrine, mosque, imam, zone, or ID"
                autocomplete="off"
              />
              <p id="searchHint" class="panel-hint">
                Start typing or use the filters to focus the map and reveal matching locations.
              </p>
            </div>

            <div class="filter-grid">
              <label class="field">
                <span>Treatment</span>
                <select id="treatmentFilter">
                  <option value="all">All treatments</option>
                </select>
              </label>

              <label class="field">
                <span>Zone</span>
                <select id="zoneFilter">
                  <option value="all">All zones</option>
                </select>
              </label>

              <label class="field">
                <span>Women's Prayer</span>
                <select id="womenFilter">
                  <option value="all">All values</option>
                </select>
              </label>

              <label class="field">
                <span>Rural / Urban</span>
                <select id="ruralUrbanFilter">
                  <option value="all">All locations</option>
                </select>
              </label>
            </div>

            <div class="controls-footer">
              <button id="resetFiltersButton" class="ghost-button" type="button">
                Reset Filters
              </button>
              <span id="sourceChip" class="source-chip">Bundled snapshot</span>
            </div>

            <p id="inlineStatus" class="inline-status hidden"></p>
          </section>

          <section
            id="resultsSection"
            class="panel-card results-card hidden"
            aria-label="Visible locations"
          >
            <div class="results-head">
              <div>
                <p class="panel-kicker">Visible Locations</p>
                <h2><span id="resultsCount">0</span> results</h2>
              </div>
              <p id="resultsSummary" class="results-summary"></p>
            </div>

            <div id="resultsEmpty" class="panel-empty hidden"></div>
            <div id="resultsList" class="results-list"></div>
          </section>
        </div>
      </aside>

      <aside
        id="detailPanel"
        class="map-panel detail-panel hidden"
        aria-label="Selected location details"
        aria-hidden="true"
      >
        <button
          id="detailCloseButton"
          class="detail-close"
          type="button"
          aria-label="Close details"
        >
          <span aria-hidden="true">&times;</span>
        </button>

        <div class="panel-scroll">
          <div id="detailBody" class="detail-body hidden">
            <header class="detail-header">
              <p id="detailKicker" class="detail-kicker"></p>
              <h2 id="detailTitle"></h2>
              <div id="detailBadges" class="badge-row"></div>
            </header>

            <section id="detailCommentsSection" class="detail-section hidden">
              <h3>Comments</h3>
              <p id="detailComments" class="detail-comments"></p>
            </section>

            <section id="detailPhotosSection" class="detail-section hidden">
              <h3>Photos</h3>
              <div id="detailPhotos" class="photo-grid"></div>
            </section>

            <section class="detail-section">
              <h3>Details</h3>
              <dl id="detailMeta" class="detail-grid"></dl>
            </section>
          </div>
        </div>
      </aside>

      <div id="mapOverlay" class="map-overlay hidden" role="status" aria-live="polite"></div>
      <div id="errorBanner" class="error-banner hidden" role="alert"></div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
