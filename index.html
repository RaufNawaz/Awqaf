<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auqaf Mosque Directory</title>
    <meta
      name="description"
      content="Interactive map and directory of Auqaf mosques across Punjab — browse by district and view locations, photos, and public details for each mosque."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auqaf Directory" />
    <meta property="og:title" content="Auqaf Mosque Directory" />
    <meta
      property="og:description"
      content="Interactive map and directory of Auqaf mosques across Punjab — browse by district and view locations, photos, and public details for each mosque."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://docs.google.com" />
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <link rel="preconnect" href="https://drive.google.com" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@800&family=Roboto+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"
      defer
    ></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="map" aria-label="Map of Auqaf locations"></div>

      <aside id="sidebar" class="collapsed" aria-label="Selected mosque details">
        <button
          id="sidebarToggle"
          class="sidebar-toggle"
          type="button"
          aria-label="Toggle sidebar"
          aria-expanded="false"
        >
          <span class="icon" aria-hidden="true"></span>
        </button>

        <div class="sidebar-inner">
          <div class="sidebar-header">
            <h1 id="mapTitle">Auqaf Directory</h1>
          </div>
          <div id="status" class="status" aria-live="polite">Loading...</div>
          <div id="details" class="details">
            <p class="muted">
              No mosque selected yet. Click a marker to view details.
            </p>
          </div>
        </div>
      </aside>
    </div>

    <script type="module" src="./js/app.js?v=drivephoto-merge-20260710"></script>
  </body>
</html>
